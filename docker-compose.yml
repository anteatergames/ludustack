services:
  ludustack-legacy-web:
    container_name: ludustack-legacy-web
    image: ${DOCKER_REGISTRY-}ludustack-legacy-web
    build:
      context: .
      dockerfile: LuduStack.Web/Dockerfile
    networks:
      - ludustack-legacy-network
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - "ludustack-legacy-db"
  ludustack-legacy-db:
    container_name: ludustack-legacy-db
    image: mongo:latest
    hostname: ludustack-legacy-db
    networks:
      - ludustack-legacy-network
    ports:
      - "27017:27017"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 10s
      start_period: 30s
    command: ["--replSet", "rs0", "--bind_ip_all"]
networks:
  ludustack-legacy-network:
    driver: bridge
